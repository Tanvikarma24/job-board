<div *ngFor="let job of jobs" class="job-card">
    <mat-card>
        <mat-card-title>{{ job.title }}</mat-card-title>
        <mat-card-subtitle>{{ job.company }} — {{ job.location }}</mat-card-subtitle>
        <mat-card-content><p>{{ job.description }}</p></mat-card-content>
    </mat-card>
</div>
